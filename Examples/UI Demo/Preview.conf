# UI preview only. Reserved documentation addresses; these nodes do not provide connectivity.
[General]
proxy-mode = rule
default-node = "Hong Kong · VLESS 01"
quic-policy = automatic

[DNS]
dns-mode = default
bootstrap-dns = system

[Proxy]
"Hong Kong · VLESS 01" = vless, 192.0.2.10, 443, uuid=2C2E1926-3426-4C27-88C1-2A8B06654247, tls=true, sni=hk.demo.example
"Hong Kong · Trojan 02" = trojan, 192.0.2.11, 443, password=ui-demo-only
"Japan · VLESS 01" = vless, 192.0.2.20, 443, uuid=3C2E1926-3426-4C27-88C1-2A8B06654247, tls=true, sni=jp.demo.example
"Japan · Shadowsocks 02" = ss, 192.0.2.21, 8388, cipher=2022-blake3-aes-128-gcm, password=AAECAwQFBgcICQoLDA0ODw==
"Singapore · Trojan 01" = trojan, 198.51.100.10, 443, password=ui-demo-only
"United States · Shadowsocks 01" = ss, 198.51.100.20, 8388, cipher=2022-blake3-chacha20-poly1305, password=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
"Germany · SOCKS5 01" = socks5, 203.0.113.10, 1080
"Local Direct" = direct

[Proxy Group]
"Auto Select" = url-test, "Hong Kong · VLESS 01", "Japan · VLESS 01", "Singapore · Trojan 01", interval=600
"Streaming" = select, "Hong Kong · VLESS 01", "Japan · Shadowsocks 02", "United States · Shadowsocks 01", selected="Japan · Shadowsocks 02"
"Social & Chat" = select, "Singapore · Trojan 01", "Hong Kong · Trojan 02", selected="Singapore · Trojan 01"
"AI Services" = select, "United States · Shadowsocks 01", "Japan · VLESS 01", selected="United States · Shadowsocks 01"
"Gaming" = select, "Hong Kong · VLESS 01", "Singapore · Trojan 01", selected="Hong Kong · VLESS 01"
"Failover" = fallback, "Hong Kong · Trojan 02", "Japan · VLESS 01", "Germany · SOCKS5 01", interval=600
"Work" = select, "Germany · SOCKS5 01", "Local Direct", selected="Germany · SOCKS5 01"

[Host]
router.demo.example = 192.0.2.1
nas.demo.example = 192.0.2.2

[Rule]
DOMAIN-SUFFIX, video.demo.example, Streaming
DOMAIN-SUFFIX, chat.demo.example, "Social & Chat"
DOMAIN-SUFFIX, ai.demo.example, "AI Services"
DOMAIN-SUFFIX, game.demo.example, Gaming
DOMAIN-SUFFIX, work.demo.example, Work
DOMAIN-SUFFIX, ads.demo.example, REJECT
IP-CIDR, 192.168.0.0/16, DIRECT, no-resolve
IP-CIDR, 10.0.0.0/8, DIRECT, no-resolve
FINAL, "Auto Select"

[MITM]
enable = false
