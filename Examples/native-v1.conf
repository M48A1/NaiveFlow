# NaiveFlow native configuration example
# Local SOCKS service is an example, not a supplied working node.
[General]
proxy-mode = rule
mitm = false
quic-policy = automatic

[Proxy]
Local = direct
Relay = socks5, 127.0.0.1, 1080

[Proxy Group]
Default = select, Local, Relay, selected=Local

[Host]
internal.example = 192.0.2.10

[GeoIP]
ZZ = 192.0.2.0/24
AS64500 = 198.51.100.0/24

[GeoSite]
example = example.com, example.org

[Rule]
DOMAIN, internal.example, DIRECT
AND,((PROTOCOL,UDP),(DEST-PORT,123)),DIRECT
GEOSITE, example, DIRECT
GEOIP, ZZ, DIRECT, no-resolve
IP-ASN, 64500, DIRECT, no-resolve
FINAL, Default

[MITM]
enable = false
hostname = example.com

[URL Rewrite]
^https://example.com/old, redirect, https://example.com/new

[Header Rewrite]
request, ^https://example.com/, add, X-Example, "a,b"

[Body Rewrite]
response, ^https://example.com/, replace, "old text", "new text"
response, ^https://example.com/, json-delete, $.ads

[Map Local]
^https://example.com/local, text, "hello"

[Script]
example = type=http-response, pattern=^https://example.com/, source=base64:ZnVuY3Rpb24gcHJvY2VzcyhjdHgpIHsgY3R4LmhlYWRlcnMucHVzaChbIlgtTmFpdmVGbG93IiwgIjEiXSk7IHJldHVybiBjdHg7IH0=
